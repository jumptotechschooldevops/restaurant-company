name: Restaurant Company CI-CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  # ==========================================
  # JOB 1 - LINT
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  # ==========================================
  # JOB 2 - SONARQUBE
  # ==========================================
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ==========================================
  # JOB 3 - TRIVY
  # ==========================================
  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1


  # ==========================================
  # JOB 4 - BUILD APPLICATION
  # Waits for all security/code checks
  # ==========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs:
      - lint
      - sonarqube
      - trivy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify dist
        run: ls -la dist


  # ==========================================
  # JOB 5 - DOCKER BUILD + TEST
  # ==========================================
  docker:
    name: Docker Build and Test
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t restaurant-company:${{ github.sha }} \
            .

      - name: Show Docker images
        run: docker images

      - name: Run container
        run: |
          docker run -d \
            --name restaurant-company \
            -p 8080:80 \
            restaurant-company:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Test container
        run: curl --fail http://localhost:8080

      - name: Show container
        run: docker ps

      - name: Stop container
        run: docker stop restaurant-company


  # ==========================================
  # JOB 6 - PUSH IMAGE TO AMAZON ECR
  # ONLY after code is merged/pushed to main
  # ==========================================
  push-to-ecr:
    name: Push Image to Amazon ECR
    runs-on: ubuntu-latest

    needs:
      - docker

    # IMPORTANT:
    # Do NOT push PR images to ECR.
    # Only push after code reaches main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------
      # Authenticate GitHub Actions with AWS
      # ------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ------------------------------------------
      # Login Docker to Amazon ECR
      # ------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------
      # Build Docker Image
      # ------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t restaurant-company:${{ github.sha }} \
            .

      # ------------------------------------------
      # Tag Image for ECR
      # ------------------------------------------
      - name: Tag Docker image
        run: |
          docker tag \
            restaurant-company:${{ github.sha }} \
            459532536656.dkr.ecr.us-east-1.amazonaws.com/restaurant-company:${{ github.sha }}

      # ------------------------------------------
      # Push SHA-tagged Image to ECR
      # ------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            459532536656.dkr.ecr.us-east-1.amazonaws.com/restaurant-company:${{ github.sha }}

      # ------------------------------------------
      # Also create latest tag
      # ------------------------------------------
      - name: Tag image as latest
        run: |
          docker tag \
            restaurant-company:${{ github.sha }} \
            459532536656.dkr.ecr.us-east-1.amazonaws.com/restaurant-company:latest

      - name: Push latest to ECR
        run: |
          docker push \
            459532536656.dkr.ecr.us-east-1.amazonaws.com/restaurant-company:latest
